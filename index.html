// ─── Cloud sync（Apps Script + Google Sheets）───
let _cachedData = null;
let _cachedRef = null;
let _lastSyncedAt = null;
let _syncTimer = null;

function loadLocalData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      // 暫存資料的版本要跟檔案一致，否則以檔案為準重建（避免被舊／空暫存蓋掉）
      if (data._v === DATA_VERSION && data.months && data.months.length > 0) {
        return normalizeData(data);
      }
    }
  } catch {}
  // 第一次開、暫存被清、或檔案資料有更新：以檔案內建資料為主檔
  const def = getDefaultData();
  def._v = DATA_VERSION;
  saveLocalData(def);
  return normalizeData(def);
}

// 對外仍叫 loadData／saveData，畫面上所有既有功能不用改
function loadData() {
  return _cachedData || loadLocalData();
}

// Ensure every expense has a splitAmong list (who shares this expense)
function normalizeData(data) {
  data.months.forEach(m => {
    if (!Array.isArray(m.fund)) m.fund = [];
    m.expenses.forEach(e => {
      if (!Array.isArray(e.splitAmong) || e.splitAmong.length === 0) {
        e.splitAmong = (e.splitType === 'personal' && e.splitFrom)
          ? [e.splitFrom]
          : [...m.participants];
      } else {
        e.splitAmong = m.participants.filter(p => e.splitAmong.includes(p));
        if (e.splitAmong.length === 0) e.splitAmong = [...m.participants];
      }
    });
  });
  return data;
}

// ─── Backup ───
function exportBackup() {
  const data = loadData();
  const ref = loadRef();
  const blob = new Blob([JSON.stringify({ expenses: data, ref: ref }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `萬隆居家雜支_備份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const obj = JSON.parse(ev.target.result);
        if (obj.expenses) saveData(obj.expenses);
        if (obj.ref) saveRef(obj.ref);
        render();
        alert('匯入成功');
      } catch { alert('檔案格式錯誤'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function saveLocalData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function saveData(data) {
  _cachedData = data;
  saveLocalData(data);
  scheduleSync();
}

function loadLocalRef() {
  try {
    const raw = localStorage.getItem(REF_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  // Default data: 2025 onwards
  return getDefaultRef();
}

function loadRef() {
  return _cachedRef || loadLocalRef();
}

function saveLocalRef(ref) {
  localStorage.setItem(REF_STORAGE_KEY, JSON.stringify(ref));
}

function saveRef(ref) {
  _cachedRef = ref;
  saveLocalRef(ref);
  scheduleSync();
}

function setSyncStatus(text) {
  const el = document.getElementById('sync-status');
  if (el) el.textContent = text;
}

let _syncInFlight = false;
let _syncQueued = false;

function scheduleSync() {
  if (!APPS_SCRIPT_URL) return;
  clearTimeout(_syncTimer);
  setSyncStatus('尚未同步…');
  _syncTimer = setTimeout(runSync, 600);
}

// 存檔一筆一筆排隊送出，避免上一筆還沒回應、下一筆就搶著送，互相判斷成衝突
async function runSync() {
  if (_syncInFlight) {
    _syncQueued = true;
    return;
  }
  _syncInFlight = true;
  await pushToServer();
  _syncInFlight = false;
  if (_syncQueued) {
    _syncQueued = false;
    runSync();
  }
}

async function pushToServer() {
  if (!APPS_SCRIPT_URL) return;
  setSyncStatus('同步中…');
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        data: { expenses: _cachedData, ref: _cachedRef },
        expectedUpdatedAt: _lastSyncedAt
      })
    });
    const json = await res.json();
    if (json.success) {
      _lastSyncedAt = json.updatedAt;
      setSyncStatus('已同步');
    } else if (json.conflict) {
      alert('有人剛剛也更新了資料，畫面會重新整理成最新版本，剛剛那筆請重新操作一次。');
      _cachedData = normalizeData(json.data.expenses);
      _cachedRef = json.data.ref;
      _lastSyncedAt = json.updatedAt;
      saveLocalData(_cachedData);
      saveLocalRef(_cachedRef);
      render();
      setSyncStatus('已同步');
    } else {
      setSyncStatus('同步失敗，稍後會重試');
    }
  } catch (err) {
    setSyncStatus('離線中，資料先存在這台裝置');
  }
}

async function refreshFromServer() {
  if (!APPS_SCRIPT_URL) { alert('還沒接上共用資料庫網址'); return; }
  setSyncStatus('讀取中…');
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const json = await res.json();
    if (json.success) {
      _cachedData = normalizeData(json.data.expenses);
      _cachedRef = json.data.ref;
      _lastSyncedAt = json.updatedAt;
      saveLocalData(_cachedData);
      saveLocalRef(_cachedRef);
      render();
      setSyncStatus('已同步');
    } else {
      setSyncStatus('讀取失敗');
    }
  } catch (err) {
    setSyncStatus('離線中，暫時看本機備份');
  }
}

async function initApp() {
  // 先用本機備份秒開畫面，避免空白
  _cachedData = loadLocalData();
  _cachedRef = loadLocalRef();
  render();

  if (!APPS_SCRIPT_URL) {
    setSyncStatus('尚未接上共用資料庫（只存在這台裝置）');
    return;
  }
  await refreshFromServer();
}

  const now = new Date();
  const label = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月`;

  const existing = data.months.find(m => m.label === label);
  if (existing) {
    if (!confirm(`${label} 已存在，要再新增一個嗎？`)) return;
  }

  const month = {
    id: genId(),
    label: label,
    participants: [...DEFAULT_PARTICIPANTS],
    fund: [],
    expenses: [],
    open: true
  };
  data.months.forEach(m => m.open = false);
  data.months.unshift(month);
  saveData(data);
  render();
}

function deleteMonth(monthId) {
  if (!confirm('確定要刪除這個月份的紀錄嗎？')) return;
  const data = loadData();
  data.months = data.months.filter(m => m.id !== monthId);
  saveData(data);
  render();
}

function toggleMonth(monthId) {
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (month) month.open = !month.open;
  saveData(data);
  render();
}

// ─── Participants ───
function addParticipant(monthId) {
  const input = document.querySelector(`#add-p-${monthId}`);
  const name = input.value.trim();
  if (!name) return;
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (month && !month.participants.includes(name)) {
    month.participants.push(name);
    month.expenses.forEach(e => {
      if (!Array.isArray(e.splitAmong)) e.splitAmong = [...month.participants];
      else if (!e.splitAmong.includes(name)) e.splitAmong.push(name);
    });
    saveData(data);
    render();
  }
}

function removeParticipant(monthId, name) {
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (!month) return;
  if (month.participants.length <= 2) {
    alert('至少需要兩個人');
    return;
  }
  const used = month.expenses.some(e => e.paidBy === name ||
    (e.splitType === 'personal' && (e.splitFrom === name || e.splitTo === name))) ||
    (month.fund || []).some(f => f.payer === name);
  if (used && !confirm(`${name} 已出現在費用項目中，移除後相關項目會需要重新設定。確定嗎？`)) return;

  month.participants = month.participants.filter(p => p !== name);
  month.expenses.forEach(e => {
    if (e.paidBy === name) e.paidBy = month.participants[0];
    if (Array.isArray(e.splitAmong)) {
      e.splitAmong = e.splitAmong.filter(p => p !== name);
      if (e.splitAmong.length === 0) e.splitAmong = [...month.participants];
    }
    if (e.splitFrom === name || e.splitTo === name) {
      e.splitType = 'equal';
      e.splitFrom = '';
      e.splitTo = '';
    }
  });
  (month.fund || []).forEach(f => {
    if (f.payer === name) f.payer = month.participants[0];
  });
  saveData(data);
  render();
}

// ─── Expenses ───
function addExpense(monthId) {
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (!month) return;
  month.expenses.push({
    id: genId(),
    name: '',
    amount: 0,
    splitType: 'equal',
    splitAmong: [...month.participants],
    paidBy: month.participants[0],
    splitFrom: '',
    splitTo: '',
  });
  saveData(data);
  render();
}

function toggleSplitAmong(monthId, expenseId, name, checked) {
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (!month) return;
  const exp = month.expenses.find(e => e.id === expenseId);
  if (!exp) return;
  if (!Array.isArray(exp.splitAmong)) exp.splitAmong = [...month.participants];
  if (checked) {
    if (!exp.splitAmong.includes(name)) exp.splitAmong.push(name);
  } else {
    if (exp.splitAmong.length <= 1) {
      alert('至少要有一人分攤這筆');
      render();
      return;
    }
    exp.splitAmong = exp.splitAmong.filter(p => p !== name);
  }
  // keep order consistent with participants
  exp.splitAmong = month.participants.filter(p => exp.splitAmong.includes(p));
  saveData(data);
  render();
}

function updateExpense(monthId, expenseId, field, value) {
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (!month) return;
  const exp = month.expenses.find(e => e.id === expenseId);
  if (!exp) return;

  if (field === 'amount') {
    exp.amount = parseFloat(value) || 0;
  } else if (field === 'splitType') {
    exp.splitType = value;
    if (value === 'personal') {
      exp.splitFrom = month.participants[0];
      exp.splitTo = month.participants[1];
      exp.paidBy = month.participants[1];
    }
  } else if (field === 'personalPair') {
    const [from, to] = value.split('>');
    exp.splitFrom = from;
    exp.splitTo = to;
    exp.paidBy = to;
  } else {
    exp[field] = value;
  }
  saveData(data);
  syncExpenseToRef(month.label, exp);
  render();
}

function removeExpense(monthId, expenseId) {
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (!month) return;
  month.expenses = month.expenses.filter(e => e.id !== expenseId);
  saveData(data);
  removeExpenseRefSync(expenseId);
  render();
}

// ─── Fund (公基金) ───
function addFundEntry(monthId) {
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (!month) return;
  if (!Array.isArray(month.fund)) month.fund = [];
  month.fund.push({
    id: genId(),
    name: '',
    nights: 1,
    amount: FUND_RATE_PER_NIGHT,
    payer: month.participants[0]
  });
  saveData(data);
  render();
}

function updateFundEntry(monthId, fundId, field, value) {
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (!month) return;
  const entry = month.fund.find(f => f.id === fundId);
  if (!entry) return;

  if (field === 'nights') {
    entry.nights = parseFloat(value) || 0;
    entry.amount = entry.nights * FUND_RATE_PER_NIGHT;
  } else if (field === 'amount') {
    entry.amount = parseFloat(value) || 0;
  } else {
    entry[field] = value;
  }
  saveData(data);
  render();
}

function removeFundEntry(monthId, fundId) {
  const data = loadData();
  const month = data.months.find(m => m.id === monthId);
  if (!month) return;
  month.fund = month.fund.filter(f => f.id !== fundId);
  saveData(data);
  render();
}

// ─── 雜支項目 → 固定開支紀錄 自動同步 ───
// 項目名稱裡有「水費」「電費」「瓦斯」「網路」就自動歸類進對應的固定開支類別，不用手動再填一次
function detectRefCategory(name) {
  if (!name) return null;
  if (name.includes('水費')) return 'water';
  if (name.includes('電費')) return 'electricity';
  if (name.includes('瓦斯')) return 'gas';
  if (name.includes('網路') || name.toLowerCase().includes('wifi')) return 'wifi';
  return null;
}

function syncExpenseToRef(monthLabel, expense) {
  const ref = loadRef();

  // 先清掉這筆之前同步過的舊紀錄（名稱改了、類別換了、金額歸零都會先清乾淨再重建）
  ref.categories.forEach(cat => {
    if (Array.isArray(cat.records)) {
      cat.records = cat.records.filter(r => r.sourceExpenseId !== expense.id);
    }
  });

  // 「個人校正」項目是兩人之間私下對帳，不是實際帳單金額，不算進固定開支紀錄
  const catId = expense.splitType !== 'personal' ? detectRefCategory(expense.name) : null;
  if (catId && expense.amount > 0) {
    const cat = ref.categories.find(c => c.id === catId);
    if (cat) {
      if (cat.type === 'table') {
        cat.records.unshift({ period: monthLabel, amount: expense.amount, note: expense.name, sourceExpenseId: expense.id });
      } else if (cat.type === 'fixed') {
        cat.amount = expense.amount;
      } else if (cat.type === 'log') {
        cat.records.unshift({ date: monthLabel, note: `${expense.name}，$${formatNum(expense.amount)}`, sourceExpenseId: expense.id });
      }
    }
  }
  saveRef(ref);
}

function removeExpenseRefSync(expenseId) {
  const ref = loadRef();
  ref.categories.forEach(cat => {
    if (Array.isArray(cat.records)) {
      cat.records = cat.records.filter(r => r.sourceExpenseId !== expenseId);
    }
  });
  saveRef(ref);
}

// ─── Calculation ───
function calcMonth(month) {
  const result = {};
  month.participants.forEach(p => {
    result[p] = { share: 0, paid: 0 };
  });

  month.expenses.forEach(exp => {
    if (exp.amount <= 0) return;

    const among = (exp.splitAmong && exp.splitAmong.length)
      ? exp.splitAmong.filter(p => result[p])
      : month.participants.slice();
    if (among.length > 0) {
      const each = exp.amount / among.length;
      among.forEach(p => { result[p].share += each; });
    }

    if (exp.paidBy && result[exp.paidBy]) {
      result[exp.paidBy].paid += exp.amount;
    }
  });

  const fundEntries = month.fund || [];
  const fundTotal = calcFundTotal(month);
  if (fundTotal > 0 && month.participants.length > 0) {
    const creditEach = fundTotal / month.participants.length;
    month.participants.forEach(p => { result[p].share -= creditEach; });
  }
  fundEntries.forEach(f => {
    if (f.payer && result[f.payer]) {
      result[f.payer].share += (f.amount || 0);
    }
  });

  return result;
}

function calcFundTotal(month) {
  return (month.fund || []).reduce((s, f) => s + (f.amount || 0), 0);
}

function calcSettlement(calcResult) {
  const balances = {};
  for (const [name, val] of Object.entries(calcResult)) {
    balances[name] = val.paid - val.share;
  }

  const settlements = [];
  const debtors = [];
  const creditors = [];

  for (const [name, bal] of Object.entries(balances)) {
    if (bal < -0.01) debtors.push({ name, amount: -bal });
    else if (bal > 0.01) creditors.push({ name, amount: bal });
  }

  debtors.sort((a, b) => b.amount - a.amount);
  creditors.sort((a, b) => b.amount - a.amount);

  let di = 0, ci = 0;
  while (di < debtors.length && ci < creditors.length) {
    const transfer = Math.min(debtors[di].amount, creditors[ci].amount);
    if (transfer > 0.01) {
      settlements.push({
        from: debtors[di].name,
        to: creditors[ci].name,
        amount: transfer
      });
    }
    debtors[di].amount -= transfer;
    creditors[ci].amount -= transfer;
    if (debtors[di].amount < 0.01) di++;
    if (creditors[ci].amount < 0.01) ci++;
  }

  return settlements;
}

// ─── Render: Months ───
function render() {
  const data = loadData();
  const container = document.getElementById('months-container');

  if (data.months.length === 0) {
    container.innerHTML = '<p style="color:#999; text-align:center; padding:40px 0;">點擊「+ 新增月份」開始記帳</p>';
  } else {
    container.innerHTML = data.months.map(month => {
      const calc = calcMonth(month);
      const settlements = calcSettlement(calc);
      const totalAmount = month.expenses.reduce((s, e) => s + (e.amount || 0), 0);
      const fundTotal = calcFundTotal(month);

      let badge = '';
      if (totalAmount > 0) {
        badge = `總額 $${formatNum(totalAmount)}`;
        if (fundTotal > 0) {
          badge += ` · 公基金折抵 $${formatNum(fundTotal)} · 淨額 $${formatNum(Math.max(totalAmount - fundTotal, 0))}`;
        }
      } else if (fundTotal > 0) {
        badge = `公基金 $${formatNum(fundTotal)}`;
      }

      return `
        <div class="month-block">
          <div class="month-header" onclick="toggleMonth('${month.id}')">
            <div class="month-header-left">
              <span class="arrow ${month.open ? 'open' : ''}">▶</span>
              <span class="month-title">${escHtml(month.label)}</span>
              ${!month.open && badge ? `<span class="month-summary-badge">${badge}</span>` : ''}
            </div>
            ${month.open ? `<span class="delete-month" onclick="event.stopPropagation(); deleteMonth('${month.id}')">刪除</span>` : ''}
          </div>
          <div class="month-body ${month.open ? 'open' : ''}">
            ${renderMonthBody(month, calc, settlements, totalAmount)}
          </div>
        </div>
      `;
    }).join('');
  }

  renderRef();
}

function renderMonthBody(month, calc, settlements, totalAmount) {
  const participantsHtml = `
    <div class="section-label">參與人</div>
    <div class="participants">
      ${month.participants.map(p => `
        <span class="participant-tag">
          ${escHtml(p)}
          <span class="remove" onclick="removeParticipant('${month.id}', '${escAttr(p)}')">&times;</span>
        </span>
      `).join('')}
      <span class="add-participant">
        <input type="text" id="add-p-${month.id}" placeholder="新增人名"
          onkeydown="if(event.key==='Enter') addParticipant('${month.id}')">
        <button class="btn btn-sm" onclick="addParticipant('${month.id}')">+</button>
      </span>
    </div>
  `;

  const fundHtml = renderFundSection(month);

  const shareHeaders = month.participants.map(p =>
    `<th style="text-align:right">${escHtml(p)} 應付</th>`
  ).join('');

  const rows = month.expenses.map(exp => {
    const among = (exp.splitAmong && exp.splitAmong.length)
      ? month.participants.filter(p => exp.splitAmong.includes(p))
      : [...month.participants];
    const shares = {};
    month.participants.forEach(p => { shares[p] = 0; });
    if (exp.amount > 0 && among.length > 0) {
      const each = exp.amount / among.length;
      among.forEach(p => { shares[p] = each; });
    }

    const shareCells = month.participants.map(p => {
      let cell = '';
      if (exp.amount > 0) {
        cell = among.includes(p) ? '$' + formatNum(shares[p]) : '<span style="color:#ccc">—</span>';
      }
      return `<td class="share-cell">${cell}</td>`;
    }).join('');

    const splitCheckboxes = `
      <div class="split-among">
        ${month.participants.map(p => `
          <label class="split-chk">
            <input type="checkbox" ${among.includes(p) ? 'checked' : ''}
              onchange="toggleSplitAmong('${month.id}', '${exp.id}', '${escAttr(p)}', this.checked)">
            ${escHtml(p)}
          </label>
        `).join('')}
      </div>
    `;

    const paidBySelect = `
      <select onchange="updateExpense('${month.id}', '${exp.id}', 'paidBy', this.value)">
        ${month.participants.map(p =>
          `<option value="${escAttr(p)}" ${exp.paidBy === p ? 'selected' : ''}>${escHtml(p)}</option>`
        ).join('')}
      </select>
    `;

    return `
      <tr>
        <td><input type="text" value="${escAttr(exp.name)}" placeholder="項目名稱"
          onchange="updateExpense('${month.id}', '${exp.id}', 'name', this.value)"></td>
        <td><input type="number" value="${exp.amount || ''}" placeholder="金額"
          onchange="updateExpense('${month.id}', '${exp.id}', 'amount', this.value)"></td>
        <td>${splitCheckboxes}</td>
        <td>${paidBySelect}</td>
        ${shareCells}
        <td><button class="btn-danger" onclick="removeExpense('${month.id}', '${exp.id}')">&times;</button></td>
      </tr>
    `;
  }).join('');

  const tableHtml = `
    <div class="table-scroll">
      <table class="expense-table">
        <thead>
          <tr>
            <th style="min-width:180px;width:25%">項目</th>
            <th style="min-width:80px">金額</th>
            <th style="min-width:70px">分攤給</th>
            <th>付款人</th>
            ${shareHeaders}
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
    <div style="margin-top:10px">
      <button class="btn btn-sm" onclick="addExpense('${month.id}')">+ 新增項目</button>
    </div>
  `;

  let settlementHtml = '';
  if (month.expenses.length > 0 && totalAmount > 0) {
    // Find who others owe (cards layout)
    let resultHtml = '';
    if (settlements.length > 0) {
      const cards = settlements.map(s =>
        `<div style="flex:1;min-width:120px;background:#b07040;color:#fff;border-radius:8px;padding:12px 16px;text-align:center">
          <div style="font-size:1.3rem;font-weight:700">${escHtml(s.from)}</div>
          <div style="font-size:1.3rem;font-weight:700;margin-top:4px">$${formatNum(s.amount)}</div>
          <div style="font-size:0.75rem;opacity:0.7;margin-top:2px">應付 ${escHtml(s.to)}</div>
        </div>`
      ).join('');
      resultHtml = `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">${cards}</div>`;
    } else if (totalAmount > 0) {
      resultHtml = '<div class="settlement-result" style="background:#6a9e5c">所有人已結清</div>';
    }

    const fundTotal = calcFundTotal(month);
    const summaryLine = fundTotal > 0
      ? `雜支總額 $${formatNum(totalAmount)} － 公基金 $${formatNum(fundTotal)} ＝ 淨額 $${formatNum(Math.max(totalAmount - fundTotal, 0))}`
      : `雜支總額 $${formatNum(totalAmount)}`;

    settlementHtml = `
      <div class="settlement">
        <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px">
          <h3 style="margin:0">結算</h3>
          <span style="font-size:0.85rem;color:#888">${summaryLine}</span>
        </div>
        ${resultHtml}
      </div>
    `;
  }

  return participantsHtml + tableHtml + fundHtml + settlementHtml;
}

// ─── Render: Reference ───
function toggleRef() {
  const ref = loadRef();
  ref.open = !ref.open;
  saveRef(ref);
  renderRef();
}

function addRefRecord(catId) {
  const ref = loadRef();
  const cat = ref.categories.find(c => c.id === catId);
  if (!cat) return;

  if (cat.type === 'table') {
    const periodInput = document.querySelector(`#ref-period-${catId}`);
    const amountInput = document.querySelector(`#ref-amount-${catId}`);
    const noteInput = document.querySelector(`#ref-note-${catId}`);
    const period = periodInput.value.trim();
    const amount = parseFloat(amountInput.value) || 0;
    const note = noteInput.value.trim();
    if (!period || !amount) return;
    cat.records.unshift({ period, amount, note });
    periodInput.value = '';
    amountInput.value = '';
    noteInput.value = '';
  } else if (cat.type === 'log') {
    const dateInput = document.querySelector(`#ref-date-${catId}`);
    const noteInput = document.querySelector(`#ref-lognote-${catId}`);
    const date = dateInput.value.trim();
    const note = noteInput.value.trim();
    if (!date) return;
    cat.records.unshift({ date, note });
    dateInput.value = '';
    noteInput.value = '';
  }

  saveRef(ref);
  renderRef();
}

function removeRefRecord(catId, index) {
  const ref = loadRef();
  const cat = ref.categories.find(c => c.id === catId);
  if (!cat) return;
  cat.records.splice(index, 1);
  saveRef(ref);
  renderRef();
}

function updateRefFixed(catId, value) {
  const ref = loadRef();
  const cat = ref.categories.find(c => c.id === catId);
  if (!cat) return;
  cat.amount = parseFloat(value) || 0;
  saveRef(ref);
}

function renderRef() {
  const ref = loadRef();
  const container = document.getElementById('ref-container');

  const catHtmls = [];
  ref.categories.forEach(cat => {
    let catHtml = '';
    if (cat.type === 'table') {
      const rows = cat.records.map((r, i) => `
        <tr>
          <td>${escHtml(r.period)}</td>
          <td class="amount">$${formatNum(r.amount)}</td>
          <td class="note">${escHtml(r.note || '')}</td>
          <td><span class="remove" style="cursor:pointer;color:#ccc;font-size:0.8rem" onclick="removeRefRecord('${cat.id}', ${i})">&times;</span></td>
        </tr>
      `).join('');

      catHtml = `
        <div class="ref-category">
          <div class="ref-category-title">${escHtml(cat.name)}</div>
          <table class="ref-table">
            <thead><tr><th>期間</th><th style="text-align:right">金額</th><th>備註</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="add-record-row">
            <input class="mid" type="text" id="ref-period-${cat.id}" placeholder="期間 (如 26.02-04)">
            <input class="short" type="number" id="ref-amount-${cat.id}" placeholder="金額">
            <input class="mid" type="text" id="ref-note-${cat.id}" placeholder="備註">
            <button class="btn btn-sm" onclick="addRefRecord('${cat.id}')">+</button>
          </div>
        </div>
      `;
    } else if (cat.type === 'fixed') {
      catHtml = `
        <div class="ref-category">
          <div class="ref-category-title">${escHtml(cat.name)}</div>
          <div class="ref-fixed-note">
            固定費用：$<input type="number" value="${cat.amount}" style="width:70px;padding:2px 6px;border:1px solid #ddd;border-radius:4px;font-size:0.85rem"
              onchange="updateRefFixed('${cat.id}', this.value)"> / ${escHtml(cat.unit)}
          </div>
        </div>
      `;
    } else if (cat.type === 'log') {
      const rows = cat.records.map((r, i) => `
        <tr>
          <td>${escHtml(r.date)}</td>
          <td>${escHtml(r.note || '')}</td>
          <td><span class="remove" style="cursor:pointer;color:#ccc;font-size:0.8rem" onclick="removeRefRecord('${cat.id}', ${i})">&times;</span></td>
        </tr>
      `).join('');

      catHtml = `
        <div class="ref-category">
          <div class="ref-category-title">${escHtml(cat.name)}</div>
          <div class="ref-fixed-note">每${escHtml(cat.unit)} $${formatNum(cat.pricePerUnit)}</div>
          <table class="ref-table">
            <thead><tr><th>日期</th><th>備註</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="add-record-row">
            <input class="mid" type="text" id="ref-date-${cat.id}" placeholder="日期 (如 26.0410)">
            <input class="mid" type="text" id="ref-lognote-${cat.id}" placeholder="備註">
            <button class="btn btn-sm" onclick="addRefRecord('${cat.id}')">+</button>
          </div>
        </div>
      `;
    }
    catHtmls.push(catHtml);
  });

  // 2-column grid: water+electricity, internet+gas
  const bodyHtml = `<div class="ref-grid">${catHtmls.join('')}</div>`;

  container.innerHTML = `
    <div class="ref-block" style="background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,0.08);overflow:hidden">
      <div class="ref-header" onclick="toggleRef()">
        <div class="ref-header-left">
          <span class="arrow ${ref.open ? 'open' : ''}">▶</span>
          <span class="ref-title">固定開支紀錄</span>
          ${!ref.open ? '<span style="font-size:0.85rem;color:#999;margin-left:8px">水費 / 電費 / 網路 / 瓦斯</span>' : ''}
        </div>
      </div>
      <div class="ref-body ${ref.open ? 'open' : ''}">
        ${bodyHtml}
      </div>
    </div>
  `;
}

// ─── Helpers ───
function formatNum(n) {
  return Math.round(n * 10) / 10 === Math.round(n)
    ? Math.round(n).toLocaleString()
    : (Math.round(n * 10) / 10).toLocaleString();
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ─── Init ───
initApp();
</script>
</body>
</html>
